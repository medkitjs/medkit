<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>medkit-image without a build step</title>
    <script type="module">
      import '/packages/elements/dist/image.js';
      import { configure, defineLoader } from '/packages/elements/dist/index.js';

      // Stands in for a CDN: the fixture media has a JPEG at each width the
      // loader asks for, because hero (2400×1350, 16:9) and logo (400×400)
      // need no width snapping.
      const local = defineLoader((src, { width }) => `media/${src}-${width}.jpg`);
      configure({ loader: local });
      setTimeout(() => configure({ loaders: { late: local } }), 300);
    </script>
  </head>
  <body>
    <main>
      <h1>medkit-image without a build step</h1>
      <medkit-image
        id="client"
        src="hero"
        width="2400"
        height="1350"
        alt="An orange gradient over dark blue"
        placeholder="color"
        color="#1d2433"
        style="display: block; aspect-ratio: 2400 / 1350"
      ></medkit-image>
      <medkit-image
        id="late"
        loader="late"
        src="logo"
        width="400"
        height="400"
        alt="A transparent logo"
        placeholder="color"
        color="#ffffff"
        style="display: block; width: 200px; aspect-ratio: 1 / 1"
      ></medkit-image>
    </main>
  </body>
</html>
