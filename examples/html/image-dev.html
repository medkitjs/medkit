<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>medkit-image development warnings</title>
    <script type="module" src="/packages/elements/dist/image-dev.js"></script>
  </head>
  <body>
    <main>
      <h1>medkit-image development warnings</h1>
      <p>Every image here is wrong on purpose, so the browser tests can check each warning.</p>
      <medkit-image id="small-priority" priority>
        <picture><img src="media/logo-320.png" width="400" height="400" alt="Logo" style="width: 40px; height: 40px" /></picture>
      </medkit-image>
      <medkit-image id="second-priority" priority>
        <picture><img src="media/gallery-2-320.jpg" width="1200" height="800" alt="Second" style="width: 60px; height: auto" /></picture>
      </medkit-image>
      <medkit-image id="no-alt">
        <picture><img src="media/gallery-3-1200.jpg" width="1200" height="800" style="display: block; width: 100%; height: auto" /></picture>
      </medkit-image>
      <medkit-image id="no-size">
        <picture><img src="media/gallery-1-320.jpg" alt="No dimensions" style="width: 160px" /></picture>
      </medkit-image>
      <medkit-image id="oversized">
        <picture>
          <img
            src="media/gallery-1-1200.jpg"
            srcset="media/gallery-1-640.jpg 640w, media/gallery-1-1200.jpg 1200w"
            sizes="100vw"
            width="1200"
            height="800"
            alt="Shown far smaller than it downloads"
            style="width: 100px; height: auto"
          />
        </picture>
      </medkit-image>
      <medkit-image id="empty"></medkit-image>
    </main>
  </body>
</html>
