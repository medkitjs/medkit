name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Newer pushes cancel older runs on feature branches; main runs every commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: Unit, types and size (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: pnpm
      # Not on the runner image; Ubuntu's build has libx264 and libsvtav1.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm size

  e2e:
    name: Browser and axe (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # The gate project depends on the engine's project, so this runs both.
      - run: pnpm test:e2e --project=${{ matrix.browser }}-gate
      # The gate keeps a recording and its frames whenever a dark frame shows the
      # overlay, in Firefox too, where that does not fail the run.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dark-frames-${{ matrix.browser }}
          path: test-results/**/dark-frame*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/**/trace.zip
          if-no-files-found: ignore

  examples:
    name: Example apps (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      # The PHP example is served by PHP's built-in server; the runner image ships PHP.
      - run: php --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:examples
      - run: pnpm build:docs
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # The example apps and the docs site, each on its production build.
      - run: pnpm test:examples --project='${{ matrix.browser }}-*'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: examples-results-${{ matrix.browser }}
          path: test-results/**/trace.zip
          if-no-files-found: ignore
